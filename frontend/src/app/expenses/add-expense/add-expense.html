<div class="add-expense-page page-background">

  <div class="form-card">

     <div class="back-button-container">
      <button
        type="button"
        class="back-btn"
        (click)="goBack()">
        ← Back to Expenses
      </button>
    </div>

    <h1>Add Expense</h1>
    <p>Record your daily expense</p>



    <form (ngSubmit)="addExpense()">

      <div class="form-group">
        <label>Expense Title</label>
        <input
          type="text"
          name="title"
          [(ngModel)]="title"
          placeholder="Enter expense title"
          required
        >
      </div>

      <div class="form-group">
        <label>Amount</label>
        <input
          type="number"
          name="amount"
          [(ngModel)]="amount"
          placeholder="Enter amount"
          min="0"
          step="0.01"
          required
        >
      </div>

      <div class="form-group">
        <label>Category</label>
        <select
          name="category"
          [(ngModel)]="category"
          required
        >
          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="form-group">
        <label>Expense Date</label>
        <input
          type="date"
          name="expense_date"
          [(ngModel)]="expense_date"
          required
        >
      </div>

      <div class="form-group">
        <label>Description</label>
        <textarea
          name="description"
          [(ngModel)]="description"
          placeholder="Enter description"
          rows="3"
        ></textarea>
      </div>

      <button type="submit">
        Add Expense
      </button>

    </form>

  </div>

</div>
