<div class="edit-expense-page page-background">

  <div class="form-card">

    <h1>Edit Expense</h1>

    <p>Update your expense details</p>

    @if (errorMessage) {
      <div class="error-message">
        {{ errorMessage }}
      </div>
    }

    @if (successMessage) {
      <div class="success-message">
        {{ successMessage }}
      </div>
    }

    <form (ngSubmit)="updateExpense()">

      <div class="form-group">

        <label>Expense Title</label>

        <input
          type="text"
          name="title"
          [(ngModel)]="title"
          placeholder="Enter expense title"
          required
        >

      </div>

      <div class="form-group">

        <label>Amount</label>

        <input
          type="number"
          name="amount"
          [(ngModel)]="amount"
          placeholder="Enter amount"
          min="0"
          step="0.01"
          required
        >

      </div>

      <div class="form-group">

        <label>Category</label>

        <select
          name="category"
          [(ngModel)]="category"
          required
        >

          <option value="">Select category</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
          <option value="Bills">Bills</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>

        </select>

      </div>

      <div class="form-group">

        <label>Expense Date</label>

        <input
          type="date"
          name="expense_date"
          [(ngModel)]="expense_date"
          required
        >

      </div>

      <div class="form-group">

        <label>Description</label>

        <textarea
          name="description"
          [(ngModel)]="description"
          placeholder="Enter description"
          rows="3"
        ></textarea>

      </div>

      <div class="button-group">

        <button
          type="submit"
          class="update-btn">
          Update Expense
        </button>

        <button
          type="button"
          class="cancel-btn"
          (click)="cancel()">
          Cancel
        </button>

      </div>

    </form>

  </div>

</div>
